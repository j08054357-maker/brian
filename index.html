<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Support</title>

    <link rel="icon" type="image/png" href="qbinc.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8faf8;
            color: #333;
            padding: 20px;
        }

        .support-card {
            width: 100%;
            max-width: 450px;
            margin: 40px auto;
            background: #ffffff;
            border: 2px solid #2ca01c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .card-header {
            background-color: #2ca01c;
            color: #ffffff;
            padding: 18px 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .card-body {
            padding: 30px 25px;
        }

        .card-body h3 {
            font-size: 18px;
            color: #111111;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .card-body p {
            font-size: 15px;
            color: #444444;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .phone-num {
            font-weight: 700;
            color: #111111;
            white-space: nowrap;
        }

        /* Talk to Agent */
        .talk-btn {
            display: inline-block;
            background-color: #2ca01c;
            color: #ffffff;
            border: 2px solid #1c6d12;
            padding: 13px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
            transition: background-color 0.2s ease,
                        transform 0.1s ease;
        }

        .talk-btn:hover {
            background-color: #248216;
        }

        .talk-btn:active {
            transform: scale(0.98);
        }

        /* Footer */
        .card-footer {
            padding: 15px 20px;
            background-color: #f9fbf9;
            border-top: 1px solid #eef2ee;
            font-size: 13px;
            color: #666666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .call-link {
            color: #2ca01c;
            font-weight: 700;
            text-decoration: none;
        }

        .call-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .support-card {
                margin: 20px auto;
            }

            .card-body {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="support-card">

        <div class="card-header">
            Customer Support
        </div>

        <div class="card-body">

            <h3>Welcome to Customer Support!</h3>

            <p>
                Thanks for reaching out. A member of our support team
                will be available to assist you.
                You can also call us anytime at
                <span class="phone-num">(615) 288-5665</span>.
            </p>

            <!-- CLICKING THIS OPENS PHONE DIALER -->
            <a
                href="tel:+16152885665"
                class="talk-btn"
            >
                Talk to Agent
            </a>

        </div>

        <div class="card-footer">

            📞

            <a
                href="tel:+16152885665"
                class="call-link"
            >
                Click here to call (615) 288-5665
            </a>

        </div>

    </div>

</body>
</html>

    </script>

</body>
</html>
